[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "chronos4pm"
version = "0.1.0"
description = "Zero-shot process-mining forecasts with Chronos-2 and PM4Py data structures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "pm4py==2.7.23.4",
    "ebi-pm==0.3.12",
    "chronos-forecasting==2.1.0",
    "numpy>=2,<3",
    "pandas>=2.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.15", "pandas-stubs", "ruff", "build", "twine"]

[tool.setuptools.packages.find]
where = ["."]
include = ["chronos4pm*"]

[tool.setuptools.package-data]
chronos4pm = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: real pinned Chronos checkpoint inference"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
